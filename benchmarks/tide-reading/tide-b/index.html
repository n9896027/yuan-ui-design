<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f0ec">
  <title>西堤自然课｜潮尺读数复核</title>
  <style>
    :root { --ink:#16313a; --muted:#60757a; --paper:#f7f6ef; --water:#dceae5; --line:#aec4bd; --deep:#17636a; --warn:#a34a25; --ok:#1f6b50; --red:#c75b37; --shadow:0 16px 42px rgba(22,49,58,.10); }
    * { box-sizing:border-box; }
    html { background:var(--water); }
    body { margin:0; color:var(--ink); background:linear-gradient(180deg,#d8e9e5 0 12rem,var(--paper) 12rem); font-family: ui-rounded, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; min-height:100vh; }
    button { font:inherit; }
    .shell { max-width:1080px; margin:auto; padding:34px 24px 52px; }
    header { display:grid; grid-template-columns:1fr auto; gap:24px; align-items:end; border-bottom:1px solid rgba(22,49,58,.24); padding-bottom:22px; }
    .eyebrow { margin:0 0 10px; font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; color:var(--deep); }
    h1 { margin:0; font-size:clamp(30px,5vw,54px); letter-spacing:-.055em; line-height:.96; font-weight:800; }
    .place { margin:13px 0 0; color:var(--muted); font-size:15px; }
    .lesson { align-self:start; color:var(--ink); text-align:right; font-size:13px; line-height:1.5; }
    .lesson b { display:block; font-size:15px; }
    .progress { margin:30px 0 26px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .stat { min-height:82px; padding:15px 18px; background:rgba(247,246,239,.70); border:1px solid var(--line); border-radius:5px; display:flex; align-items:baseline; gap:10px; }
    .stat strong { font:800 36px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.1em; }
    .stat span { color:var(--muted); font-size:14px; }
    .intro { margin:0 0 18px; max-width:690px; line-height:1.7; font-size:15px; }
    .workbench { background:var(--paper); border:1px solid rgba(22,49,58,.22); box-shadow:var(--shadow); }
    .records { display:grid; grid-template-columns:220px 1fr; min-height:382px; }
    .record-nav { padding:18px; background:#e6efeb; border-right:1px solid var(--line); }
    .record-nav h2 { margin:2px 0 16px; font-size:13px; letter-spacing:.08em; }
    .record-list { padding:0; margin:0; list-style:none; display:grid; gap:8px; }
    .record-tab { width:100%; min-height:59px; padding:10px 12px; display:grid; grid-template-columns:1fr auto; align-items:center; border:1px solid transparent; border-radius:3px; color:var(--ink); background:transparent; text-align:left; cursor:pointer; }
    .record-tab:hover { background:rgba(255,255,255,.5); }
    .record-tab[aria-selected="true"] { background:var(--paper); border-color:var(--deep); box-shadow:3px 3px 0 var(--deep); }
    .record-time { display:block; font:800 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .record-note { display:block; margin-top:5px; color:var(--muted); font-size:12px; }
    .mark { width:11px; height:11px; border:1.5px solid var(--muted); border-radius:50%; }
    .mark.ok { border-color:var(--ok); background:var(--ok); }
    .mark.check { border-color:var(--red); background:var(--red); transform:rotate(45deg); border-radius:1px; }
    .review { padding:26px clamp(22px,4vw,48px) 30px; display:flex; flex-direction:column; }
    .review-top { display:flex; justify-content:space-between; gap:20px; align-items:baseline; }
    .review h2 { margin:0; font-size:clamp(25px,3vw,33px); letter-spacing:-.04em; }
    .unit { color:var(--muted); font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; }
    .comparison { margin:31px 0 22px; display:grid; grid-template-columns:1fr 94px 1fr; gap:13px; align-items:center; }
    .reading { min-height:149px; padding:17px; border:1px solid var(--line); position:relative; overflow:hidden; }
    .reading::after { content:""; position:absolute; left:0; right:0; bottom:0; height:calc(var(--height) * 1%); background:var(--water); border-top:2px solid var(--deep); z-index:0; }
    .reading > * { position:relative; z-index:1; }
    .source { margin:0; font-weight:700; font-size:13px; }
    .value { margin:28px 0 0; font:800 clamp(46px,8vw,72px)/.8 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.13em; }
    .value small { font:700 16px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:0; }
    .versus { color:var(--muted); font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace; text-align:center; }
    .versus::before,.versus::after { content:""; display:block; height:1px; margin:8px 0; background:var(--line); }
    .difference { min-height:49px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:13px 0; display:flex; justify-content:space-between; gap:16px; align-items:baseline; }
    .difference span { color:var(--muted); font-size:14px; }
    .difference strong { font:800 18px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .actions { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; margin-top:auto; padding-top:28px; }
    .action { min-height:48px; border:1px solid var(--ink); border-radius:3px; padding:9px 13px; background:transparent; color:var(--ink); cursor:pointer; font-weight:750; }
    .action:hover { background:#e9f0ed; }
    .action.primary { color:#fff; background:var(--deep); border-color:var(--deep); }
    .action.primary:hover { background:#0f5157; }
    .action.warning { color:#fff; background:var(--red); border-color:var(--red); }
    .action.warning:hover { background:#aa4526; }
    .action.undo { color:var(--muted); border-color:var(--line); }
    .action:focus-visible,.record-tab:focus-visible { outline:3px solid #efad31; outline-offset:3px; }
    .saved { min-height:21px; margin:13px 0 0; color:var(--ok); font-size:13px; }
    .local-note { margin:21px 0 0; color:var(--muted); font-size:12px; line-height:1.55; }
    .local-note::before { content:"◎"; color:var(--deep); margin-right:6px; }
    .footer { margin:19px 0 0; color:var(--muted); font-size:12px; }
    @media (max-width:650px) { body { background:linear-gradient(180deg,#d8e9e5 0 9rem,var(--paper) 9rem); } .shell { padding:25px 15px 34px; } header { grid-template-columns:1fr; gap:15px; padding-bottom:17px; } .lesson { text-align:left; } .progress { margin:21px 0; gap:8px; } .stat { min-height:70px; padding:12px; flex-direction:column; gap:3px; } .stat strong { font-size:30px; } .records { grid-template-columns:1fr; } .record-nav { padding:13px; border-right:0; border-bottom:1px solid var(--line); } .record-nav h2 { display:none; } .record-list { grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; } .record-tab { min-height:57px; display:block; padding:9px 8px; } .record-time { font-size:15px; } .record-note { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .mark { float:right; margin-top:-18px; } .review { padding:23px 18px 21px; } .comparison { grid-template-columns:1fr; gap:7px; margin:21px 0 17px; } .reading { min-height:118px; display:grid; grid-template-columns:1fr auto; align-items:end; } .value { margin:0; } .versus { display:flex; align-items:center; gap:8px; } .versus::before,.versus::after { flex:1; margin:0; } .actions { grid-template-columns:1fr 1fr; padding-top:21px; } .action.undo { grid-column:1 / -1; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">WEEKEND FIELD NOTE / 11.16</p>
        <h1>潮尺读数复核</h1>
        <p class="place">西堤自然课 · 观测点：西堤木栈道</p>
      </div>
      <p class="lesson"><b>同刻双份读数</b>逐对确认后留档</p>
    </header>
    <section class="progress" aria-label="复核进度">
      <div class="stat"><strong id="doneCount">0</strong><span>已完成复核 / 3</span></div>
      <div class="stat"><strong id="checkCount">0</strong><span>标为需回查</span></div>
    </section>
    <p class="intro">左边是现场手写记录，右边是资料录入值。请选择一个时刻，比较数值后给出判断。</p>
    <section class="workbench" aria-label="读数复核工作台">
      <div class="records">
        <nav class="record-nav" aria-label="选择观测时刻">
          <h2>观测时刻</h2>
          <ul class="record-list" id="recordList"></ul>
        </nav>
        <section class="review" aria-labelledby="reviewTitle">
          <div class="review-top"><h2 id="reviewTitle">—</h2><span class="unit">UNIT: CM</span></div>
          <div class="comparison">
            <div class="reading" id="handCard"><p class="source">手写记录</p><p class="value" id="handValue">—</p></div>
            <div class="versus">对照</div>
            <div class="reading" id="entryCard"><p class="source">录入值</p><p class="value" id="entryValue">—</p></div>
          </div>
          <div class="difference"><span>两份读数相差</span><strong id="difference">—</strong></div>
          <div class="actions" aria-label="本对读数的判断">
            <button class="action primary" type="button" data-decision="match">标为一致</button>
            <button class="action warning" type="button" data-decision="check">标为需回查</button>
            <button class="action undo" type="button" id="undo">撤销判断</button>
          </div>
          <p class="saved" id="status" aria-live="polite">尚未判断</p>
          <p class="local-note">判断仅保留在本机此浏览器；刷新页面后会读回。</p>
        </section>
      </div>
    </section>
    <p class="footer">资料录入检查 · 所有读数单位为厘米</p>
  </main>
  <script>
    (() => {
      const data = [
        { time: '07:10', hand: 42, entry: 42 },
        { time: '07:25', hand: 56, entry: 65 },
        { time: '07:40', hand: 68, entry: 68 }
      ];
      const key = 'xidi-tide-review-v1';
      let decisions = {};
      try { decisions = JSON.parse(localStorage.getItem(key)) || {}; } catch (_) { decisions = {}; }
      let selected = 0;
      const $ = id => document.getElementById(id);
      const clamp = value => Math.max(12, Math.min(88, value));
      function save() { try { localStorage.setItem(key, JSON.stringify(decisions)); } catch (_) { $('status').textContent = '本次判断已显示，但浏览器未允许本地保存。'; } }
      function decisionText(value) { return value === 'match' ? '已标为一致' : value === 'check' ? '已标为需回查' : '尚未判断'; }
      function renderNav() {
        $('recordList').innerHTML = data.map((row, i) => {
          const state = decisions[i]; const note = state === 'match' ? '一致' : state === 'check' ? '需回查' : '待判断';
          return `<li><button class="record-tab" type="button" data-index="${i}" aria-selected="${i === selected}"><span><span class="record-time">${row.time}</span><span class="record-note">${note}</span></span><i class="mark ${state || ''}" aria-hidden="true"></i></button></li>`;
        }).join('');
        document.querySelectorAll('.record-tab').forEach(button => button.addEventListener('click', () => { selected = Number(button.dataset.index); render(); }));
      }
      function render() {
        const row = data[selected], diff = Math.abs(row.hand - row.entry), state = decisions[selected];
        $('reviewTitle').textContent = row.time + ' 的读数';
        $('handValue').innerHTML = `${row.hand}<small> cm</small>`;
        $('entryValue').innerHTML = `${row.entry}<small> cm</small>`;
        $('handCard').style.setProperty('--height', clamp(row.hand));
        $('entryCard').style.setProperty('--height', clamp(row.entry));
        $('difference').textContent = diff + ' cm';
        $('status').textContent = decisionText(state);
        $('undo').disabled = !state;
        $('undo').setAttribute('aria-disabled', String(!state));
        const done = Object.keys(decisions).filter(k => decisions[k] === 'match' || decisions[k] === 'check').length;
        const check = Object.values(decisions).filter(v => v === 'check').length;
        $('doneCount').textContent = done; $('checkCount').textContent = check;
        renderNav();
      }
      document.querySelectorAll('[data-decision]').forEach(button => button.addEventListener('click', () => { decisions[selected] = button.dataset.decision; save(); render(); }));
      $('undo').addEventListener('click', () => { if (!decisions[selected]) return; delete decisions[selected]; save(); render(); });
      render();
    })();
  </script>
</body>
</html>
