<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>周六归还 · 南桥社区工具借用处</title>
<style>
:root{--ink:#232a25;--muted:#697169;--paper:#faf8f1;--ground:#e9e7dc;--line:#c8c9bf;--pine:#174739;--pine-dark:#10362b;--stamp:#b8492f;--done:#e1ede2;--focus:#eea42a}
*{box-sizing:border-box}html{background:var(--ground)}body{margin:0;color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:linear-gradient(90deg,transparent 0 31px,#dddacd 31px 32px,transparent 32px) center/100% 100%,var(--ground)}
header,main{max-width:1100px;margin:auto;padding-inline:28px}header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #bbbcb2;font-size:14px;letter-spacing:.04em}.place{font-weight:780}.date{color:var(--muted);font-size:13px}
main{padding-top:38px;padding-bottom:44px}.intro{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:24px}.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 11px;font-size:13px;font-weight:750;letter-spacing:.12em;color:var(--pine)}.eyebrow:before{content:"";display:inline-block;width:10px;height:10px;background:var(--stamp);border-radius:50%}h1{font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.055em;margin:0;font-weight:780}.intro p{max-width:580px;color:var(--muted);margin:12px 0 0;font-size:15px}.guide{border-left:4px solid var(--pine);padding:6px 0 6px 14px;color:var(--muted);font-size:13px;line-height:1.5}.guide strong{display:block;color:var(--ink);font-size:14px}
.content{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:38px;margin-top:28px;align-items:start}.queue-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}.queue-title h2{font-size:16px;margin:0;font-weight:760}.queue-title span{font-size:13px;color:var(--muted)}.rows{border-top:1px solid var(--line)}
article{position:relative;display:grid;grid-template-columns:22px minmax(135px,1fr) minmax(174px,1.35fr) auto;gap:18px;align-items:center;padding:21px 0;border-bottom:1px solid var(--line);transition:background-color .16s ease}.mark{width:18px;height:18px;border:2px solid var(--stamp);border-radius:50%;position:relative}.tool{min-width:0}.tool h3{margin:0;font-size:21px;line-height:1.2;letter-spacing:-.025em}.number{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--pine);font-weight:750;margin-top:4px}.check{margin:0;color:#39413b;font-size:14px}.check b{display:block;font-size:11px;letter-spacing:.09em;color:var(--muted);font-weight:760;margin-bottom:2px}
button{border:1px solid var(--pine);border-radius:2px;background:var(--pine);color:#fff;font:700 14px/1 ui-sans-serif,system-ui,sans-serif;padding:12px 16px;min-height:42px;cursor:pointer;white-space:nowrap;transition:background .16s ease,transform .12s ease}button:hover{background:var(--pine-dark)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}article:has(button[aria-pressed="true"]){background:linear-gradient(90deg,var(--done),transparent 85%)}article:has(button[aria-pressed="true"]) .mark{background:var(--pine);border-color:var(--pine)}article:has(button[aria-pressed="true"]) .mark:after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}button[aria-pressed="true"]{background:transparent;color:var(--pine);border-color:#759688}button[aria-pressed="true"]:hover{background:#d2e4d5}
aside{background:var(--paper);border-top:5px solid var(--pine);box-shadow:4px 5px 0 #c9c6b9;padding:19px 20px 21px}.desk-label{margin:0;color:var(--muted);font-size:12px;font-weight:760;letter-spacing:.1em}.desk-title{margin:4px 0 18px;font-size:20px;letter-spacing:-.025em}.rule{height:1px;background:var(--line);margin:15px 0}output{display:block;font-variant-numeric:tabular-nums;font-size:15px;font-weight:740;color:var(--pine)}.note{margin:7px 0 0;font-size:13px;color:var(--muted)}
@media(max-width:700px){header,main{padding-inline:19px}header{height:58px}.date{display:none}main{padding-top:26px}.intro{display:block;padding-bottom:20px}.guide{margin-top:20px}.content{display:block;margin-top:23px}.queue-title{margin-bottom:5px}.content aside{margin-top:28px}article{grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:18px 0}.check{grid-column:2/4;grid-row:2}.tool h3{font-size:19px}button{padding:11px 12px;font-size:13px}.mark{width:16px;height:16px}article:has(button[aria-pressed="true"]) .mark:after{left:3px;top:0;width:5px;height:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
<header><span class="place">南桥社区工具借用处</span><span class="date">周六 · 归还点交台</span></header>
<main>
<section class="intro" aria-labelledby="page-title"><div><p class="eyebrow">本班待办 · 03 件</p><h1 id="page-title">周六归还点交</h1><p>逐件确认工具号与应随附配件；核对无误后，再在此记录点交。</p></div><div class="guide"><strong>点交顺序</strong>工具号 → 配件 → 记录</div></section>
<div class="content"><section aria-labelledby="queue-heading"><div class="queue-title"><h2 id="queue-heading">待核对工具</h2><span>按归还件逐项处理</span></div><div class="rows">
<article><span class="mark" aria-hidden="true"></span><div class="tool"><h3>冲击钻</h3><div class="number">工具号 D-17</div></div><p class="check"><b>随附配件</b>核对两块电池</p><button type="button" data-id="D-17" aria-pressed="false">标为已点交</button></article>
<article><span class="mark" aria-hidden="true"></span><div class="tool"><h3>扭矩扳手</h3><div class="number">工具号 W-04</div></div><p class="check"><b>随附配件</b>核对延长杆</p><button type="button" data-id="W-04" aria-pressed="false">标为已点交</button></article>
<article><span class="mark" aria-hidden="true"></span><div class="tool"><h3>热风枪</h3><div class="number">工具号 H-09</div></div><p class="check"><b>随附配件</b>核对两个风嘴</p><button type="button" data-id="H-09" aria-pressed="false">标为已点交</button></article>
</div></section><aside aria-label="值班台进度"><p class="desk-label">值班台</p><h2 class="desk-title">本班记录</h2><div class="rule"></div><output id="total" aria-live="polite"></output><p class="note">点交状态会保留在这台设备上。</p></aside></div>
</main>
<script>
const completed=new Set(JSON.parse(localStorage.getItem('nanqiao-returns')||'[]'));
function draw(){for(const button of document.querySelectorAll('[data-id]')){const checked=completed.has(button.dataset.id);button.setAttribute('aria-pressed',String(checked));button.textContent=checked?'撤销点交':'标为已点交';}document.getElementById('total').textContent='已点交 '+completed.size+' / 3';}
document.addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(!button)return;const id=button.dataset.id;if(completed.has(id))completed.delete(id);else completed.add(id);localStorage.setItem('nanqiao-returns',JSON.stringify([...completed]));draw();});draw();
</script>
</html>
