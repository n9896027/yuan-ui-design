<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周六归还 · 南桥社区工具借用处</title>
<style>
:root{--ink:#202a29;--muted:#63706b;--paper:#f3f1e9;--line:#c9cec5;--green:#315c50;--dark:#23463d;--done:#e3eee7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:34px 42px 48px}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:13px;letter-spacing:.02em}.place{font-weight:700;font-size:15px}.day{font-size:13px;color:var(--muted)}.masthead{display:grid;grid-template-columns:1fr 286px;gap:34px;padding:30px 0 25px;border-bottom:1px solid var(--line)}.kicker{font-size:13px;color:var(--green);font-weight:700;letter-spacing:.09em}.masthead h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.055em;line-height:1.08;margin:8px 0 13px;font-weight:760}.intro{margin:0;color:var(--muted);max-width:510px}.desk-note{align-self:end;border-left:4px solid var(--green);padding:8px 0 8px 16px;color:var(--muted);font-size:14px}.desk-note b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}main{padding-top:23px}.instruction{display:flex;align-items:center;justify-content:space-between;margin:0 0 15px}.instruction h2{font-size:16px;margin:0;font-weight:700}.instruction p{margin:0;font-size:13px;color:var(--muted)}.ledger{border-top:2px solid var(--ink)}.item{display:grid;grid-template-columns:78px minmax(135px,1fr) minmax(220px,1.7fr) 144px;align-items:center;gap:20px;padding:18px 10px;border-bottom:1px solid var(--line);transition:background .18s ease}.item:hover{background:#eeece3}.number{font-size:14px;color:var(--green);font-weight:750;letter-spacing:.04em}.tool h3{font-size:19px;margin:0 0 2px;letter-spacing:-.025em}.tool span{font-size:13px;color:var(--muted)}.check{color:var(--muted);font-size:14px}.check b{display:block;color:var(--ink);font-size:12px;letter-spacing:.08em;margin-bottom:2px}.check span{color:var(--green);font-weight:650}button{min-height:44px;width:100%;border:1px solid var(--green);border-radius:3px;background:transparent;color:var(--dark);font:650 14px inherit;cursor:pointer;transition:background .15s,color .15s,transform .15s}button:hover{background:var(--green);color:#fff}button:active{transform:translateY(1px)}button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}.item:has(button[aria-pressed="true"]){background:var(--done)}.item:has(button[aria-pressed="true"]) .number{color:var(--dark)}.footer-panel{display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px;margin-top:30px;padding:18px 0 0;border-top:2px solid var(--ink)}.footer-panel p{margin:0;color:var(--muted);font-size:13px}.footer-panel b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}output{font-variant-numeric:tabular-nums;font-size:20px;font-weight:750;letter-spacing:-.02em;color:var(--dark);white-space:nowrap}@media(max-width:640px){.wrap{padding:23px 20px 32px}header{padding-bottom:11px}.day{font-size:12px}.masthead{grid-template-columns:1fr;gap:20px;padding:25px 0 22px}.masthead h1{font-size:39px}.desk-note{align-self:auto}.instruction{align-items:flex-start;gap:10px}.instruction p{text-align:right;max-width:150px}.item{grid-template-columns:58px 1fr;gap:8px 13px;padding:18px 2px}.number{grid-row:span 2;align-self:start;padding-top:3px}.tool h3{font-size:18px}.check{grid-column:2}.item button{grid-column:2;margin-top:5px}.footer-panel{grid-template-columns:1fr;gap:15px;align-items:start}.footer-panel output{font-size:21px}}
</style><body><div class="wrap"><header><div class="place">南桥社区工具借用处</div><div class="day">周六 · 归还点交</div></header><section class="masthead" aria-labelledby="page-title"><div><div class="kicker">归还台 / 本日清单</div><h1 id="page-title">逐件点交，再收工。</h1><p class="intro">请按工具号核对归还物与配件；每完成一件，在这里留下点交状态。</p></div><div class="desk-note"><b>值班提示</b>点交完成后可随时撤销；本页会记住当前状态。</div></section><main><div class="instruction"><h2>等待核对的工具</h2><p>先看编号，再看配件</p></div><section class="ledger" aria-label="归还工具清单"><article class="item"><div class="number">D-17</div><div class="tool"><h3>冲击钻</h3><span class="status">待点交</span></div><div class="check"><b>配件核对</b>两块<span>电池</span></div><button type="button" data-id="D-17" aria-pressed="false">标为已点交</button></article><article class="item"><div class="number">W-04</div><div class="tool"><h3>扭矩扳手</h3><span class="status">待点交</span></div><div class="check"><b>配件核对</b><span>延长杆</span></div><button type="button" data-id="W-04" aria-pressed="false">标为已点交</button></article><article class="item"><div class="number">H-09</div><div class="tool"><h3>热风枪</h3><span class="status">待点交</span></div><div class="check"><b>配件核对</b>两个<span>风嘴</span></div><button type="button" data-id="H-09" aria-pressed="false">标为已点交</button></article></section><aside class="footer-panel"><p><b>值班台</b>状态会保存在这台设备上，刷新页面后仍可继续点交。</p><output id="total" aria-live="polite"></output></aside></main></div><script>
const completed=new Set(JSON.parse(localStorage.getItem('nanqiao-returns')||'[]'));
function draw(){for(const button of document.querySelectorAll('[data-id]')){const checked=completed.has(button.dataset.id);button.setAttribute('aria-pressed',String(checked));button.textContent=checked?'撤销点交':'标为已点交';button.closest('article').querySelector('.status').textContent=checked?'已点交':'待点交';}document.getElementById('total').textContent='已点交 '+completed.size+' / 3';}
document.addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(!button)return;const id=button.dataset.id;if(completed.has(id))completed.delete(id);else completed.add(id);localStorage.setItem('nanqiao-returns',JSON.stringify([...completed]));draw();});draw();
</script></body></html>
