<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>岸站设备维修</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;color:#253532;background:#f5f7f6}main{max-width:1260px;margin:auto;padding:24px}h1{font-size:24px;margin:0}h2{font-size:20px;white-space:nowrap;flex:0 0 auto}header{border-bottom:1px solid #ccd6d1;padding-bottom:16px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.8fr);gap:24px;margin-top:24px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{padding:12px;text-align:left;border-bottom:1px solid #dbe2de}th{font-size:12px}button{font:inherit;padding:8px 14px;border:1px solid #78938a;background:white;color:#244c40;border-radius:4px;cursor:pointer}.primary{background:#275b49;color:white}.edit-header{display:flex;align-items:center;gap:18px}label{display:block;margin:14px 0 4px}textarea,input[type=text],select{width:100%;padding:9px;font:inherit;border:1px solid #8d9e95;background:white;border-radius:4px}textarea{min-height:112px}form{min-width:0}aside{margin-top:24px;border-top:1px dashed #9cad9f;padding-top:12px}.muted{color:#52655e}#status{display:block;min-height:24px;margin-top:12px}:focus-visible{outline:3px solid #356cac;outline-offset:3px}@media(max-width:760px){main{padding:16px}.workspace{display:block}form{margin-top:28px}}
</style><main><header><h1>岸站设备维修</h1><p class="muted">示例工作区 · 本机数据，不连接实际维修系统</p></header><section class="workspace"><div><h3>维修队列</h3><div class="table-wrap"><table><thead><tr><th>工单</th><th>设备</th><th>状态</th><th>优先级</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></div><form id="editor"><div class="edit-header"><h2 id="editor-title"></h2><button class="primary" data-eval="save" type="submit">保存</button></div><label for="device">设备名称</label><input id="device" data-eval="device" type="text" required><label for="note">检修备注</label><textarea id="note" data-eval="note"></textarea><output role="status" id="status" data-eval="save-status" data-state="idle">尚未修改</output></form></section><aside><label><input data-eval="fail-save" id="fail-save" type="checkbox"> 模拟保存失败</label><p class="muted">评测控制：用于复现失败，不会调用外部服务。</p></aside></main><script src="assets/data.js"></script><script src="assets/mock.js"></script><script>
let selected='W02';const form=document.querySelector('#editor'),device=document.querySelector('#device'),note=document.querySelector('#note'),status=document.querySelector('#status'),save=document.querySelector('[data-eval=save]');function showEditor(id){selected=id;const job=EvaluationStore.readJobs().find(job=>job.id===id);device.value=job.device;note.value=job.note;document.querySelector('#editor-title').textContent=job.device;status.textContent='尚未修改';status.dataset.state='idle'}function renderRows(){document.querySelector('#rows').innerHTML=EvaluationStore.readJobs().map(job=>'<tr><td>'+job.id+'</td><td>'+job.device+'</td><td>'+job.status+'</td><td>'+job.priority+'</td><td><button data-eval="edit-'+job.id+'" type="button">编辑</button></td></tr>').join('');document.querySelectorAll('[data-eval^=edit-]').forEach(button=>button.onclick=()=>showEditor(button.dataset.eval.replace('edit-','')))}form.addEventListener('input',()=>{status.textContent='有未保存更改';status.dataset.state='dirty'});form.onsubmit=async event=>{event.preventDefault();save.disabled=true;status.dataset.state='saving';status.textContent='正在保存';try{await EvaluationStore.saveJob(selected,{device:device.value,note:note.value},{fail:document.querySelector('#fail-save').checked});status.dataset.state='saved';status.textContent='已保存到本机';renderRows()}catch(error){form.reset();status.dataset.state='error';status.textContent='保存失败，请重试'}finally{save.disabled=false}};renderRows();showEditor(selected);
</script></html>
