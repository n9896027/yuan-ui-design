<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>设备编辑 · 本地评测样例</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #202a2b; background: #f6f8f8; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 960px; margin: auto; padding: 24px; }
  .editor-header { display: flex; align-items: center; gap: 20px; }
  h1 { flex: 0 0 auto; margin: 16px 0; font-size: 22px; white-space: nowrap; }
  button { flex: 0 0 auto; padding: 10px 18px; border: 0; border-radius: 4px; color: white; background: #245b52; font: inherit; }
  button:disabled { opacity: .6; }
  label { display: block; margin: 16px 0 4px; }
  input[type="text"], textarea { display: block; width: 100%; padding: 10px; border: 1px solid #82948f; border-radius: 4px; font: inherit; }
  textarea { min-height: 120px; }
  :focus-visible { outline: 3px solid #2d66ae; outline-offset: 3px; }
  .test-panel { margin-top: 32px; padding: 16px; border: 1px dashed #82948f; }
  .test-panel label { margin: 0; }
  #status { display: block; min-height: 28px; margin-top: 16px; }
</style>
<main>
  <p>本地评测样例：资料只保存在此浏览器，不调用真实维修系统。</p>
  <form id="editor">
    <header class="editor-header">
      <h1>东岸观测站二号防腐机柜内盐度与溶氧联合采集设备</h1>
      <button id="save" type="submit">保存</button>
    </header>
    <label for="device">设备名称</label>
    <input id="device" name="device" type="text" required value="东岸观测站二号防腐机柜内盐度与溶氧联合采集设备">
    <label for="note">检修备注</label>
    <textarea id="note" name="note">暴雨后间歇离线，先核对供电。</textarea>
    <output id="status" role="status" aria-live="polite">尚未修改</output>
  </form>
  <aside class="test-panel" aria-label="评测控制">
    <label><input id="fail-save" type="checkbox"> 模拟本次保存失败</label>
    <p>此控制用于触发确定性失败，不是产品操作。</p>
  </aside>
</main>
<script>
  const storageKey = 'product-ui-eval-editor-v1';
  const form = document.querySelector('#editor');
  const save = document.querySelector('#save');
  const status = document.querySelector('#status');
  const device = document.querySelector('#device');
  const note = document.querySelector('#note');
  let committed = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if (committed) {
    device.value = committed.device;
    note.value = committed.note;
    status.textContent = '已载入本机保存内容';
  }
  async function saveAdapter(draft) {
    await Promise.resolve();
    if (document.querySelector('#fail-save').checked) throw new Error('本地模拟失败');
    localStorage.setItem(storageKey, JSON.stringify(draft));
    return draft;
  }
  form.addEventListener('input', () => { status.textContent = '有未保存更改'; });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (save.disabled) return;
    save.disabled = true;
    status.textContent = '正在保存到本机';
    const draft = { device: device.value, note: note.value };
    try {
      committed = await saveAdapter(draft);
      status.textContent = '已保存到本机';
    } catch (error) {
      form.reset();
      status.textContent = '保存失败，请重试';
    } finally {
      save.disabled = false;
    }
  });
</script>
</html>
