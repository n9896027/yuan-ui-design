name: Verify skill package

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Check package integrity
        run: node scripts/check-repository.mjs
      - name: Run UI evidence self-test
        run: node skills/yuan-ui-design/scripts/validate-ui-evidence.mjs --self-test
      - name: Run artifact manifest self-test
        run: node skills/yuan-ui-design/scripts/ui-artifacts.mjs --self-test
      - name: Test image imports and source records
        run: |
          python3 -m venv "$RUNNER_TEMP/yuan-image-checks"
          "$RUNNER_TEMP/yuan-image-checks/bin/pip" install "Pillow>=11.3,<14"
          "$RUNNER_TEMP/yuan-image-checks/bin/python" -B skills/yuan-ui-design/scripts/test_image_provenance.py
          "$RUNNER_TEMP/yuan-image-checks/bin/python" -B skills/yuan-ui-design/scripts/test_unslop_review.py
      - name: Install browser for interaction checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Exercise historical data and delayed saves
        run: npm run test:editor
      - name: Exercise photo inspection on desktop and mobile layouts
        run: npm run test:photo
      - name: Verify editable slides and rendered programme assets
        run: python3 examples/silent-programme/check.py
      - name: Verify mini-program content and storage contract
        run: |
          python3 examples/silent-programme/wechat/scripts/sync_programme.py --check
          node examples/silent-programme/wechat/scripts/test_storage.js
      - name: Verify exhibit repair against its original storage contract
        run: npm run test:transfer
      - name: Verify 3D compatibility rules and fallback
        run: npm run test:3d

  native-inspection:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/native-inspection
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test local draft and attachment recovery
        run: swift test
      - name: Build the iOS app for the simulator SDK
        run: |
          xcodebuild -project NativeInspection.xcodeproj -scheme NativeInspection \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/inspection-ios" \
            CODE_SIGNING_ALLOWED=NO build
