name: Verify skill package

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Check package integrity
        run: node scripts/check-repository.mjs
      - name: Run UI evidence self-test
        run: node skills/yuan-ui-design/scripts/validate-ui-evidence.mjs --self-test
      - name: Run artifact manifest self-test
        run: node skills/yuan-ui-design/scripts/ui-artifacts.mjs --self-test
